<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Мои задачи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "#f7f7f5",
              ink: "#18181b",
              accent: "#e85d3f",
            },
            boxShadow: {
              card: "0 24px 70px -32px rgba(24, 24, 27, 0.28)",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      * { -webkit-tap-highlight-color: transparent; }
      body { min-height: 100vh; }
      .task-row { animation: task-in 220ms ease-out both; }
      @keyframes task-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .check-icon { transform: scale(0); transition: transform 160ms ease; }
      input:checked + .checkbox-ui .check-icon { transform: scale(1); }
      input:checked + .checkbox-ui { background: #18181b; border-color: #18181b; }
    </style>
  </head>
  <body class="bg-canvas font-sans text-ink antialiased selection:bg-orange-200">
    <main class="relative flex min-h-screen items-start justify-center overflow-hidden px-4 py-12 sm:px-6 sm:py-20">
      <div class="pointer-events-none absolute -left-24 top-16 h-64 w-64 rounded-full bg-orange-200/30 blur-3xl"></div>
      <div class="pointer-events-none absolute -right-20 bottom-10 h-72 w-72 rounded-full bg-stone-300/40 blur-3xl"></div>

      <section class="relative w-full max-w-2xl overflow-hidden rounded-[28px] border border-black/[0.06] bg-white shadow-card">
        <header class="border-b border-zinc-100 px-6 pb-6 pt-7 sm:px-9 sm:pb-8 sm:pt-9">
          <div class="mb-7 flex items-start justify-between gap-4">
            <div>
              <p id="today" class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-zinc-400"></p>
              <h1 class="text-3xl font-semibold tracking-[-0.04em] sm:text-4xl">Мои задачи</h1>
              <p class="mt-2 text-sm text-zinc-500">Один небольшой шаг за раз.</p>
            </div>
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-zinc-950 text-white shadow-sm" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
            </div>
          </div>

          <form id="task-form" class="rounded-2xl border border-zinc-200 bg-zinc-50/80 p-2 transition focus-within:border-zinc-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-zinc-100">
            <label for="task-input" class="sr-only">Новая задача</label>
            <input id="task-input" class="h-11 w-full bg-transparent px-3 text-[15px] font-medium outline-none placeholder:font-normal placeholder:text-zinc-400" type="text" maxlength="100" autocomplete="off" placeholder="Например, подготовить презентацию" />
            <div class="mt-1 flex items-center justify-between border-t border-zinc-200/80 px-1 pt-2">
              <span class="hidden pl-2 text-xs text-zinc-400 sm:inline">Enter — добавить</span>
              <div class="ml-auto flex gap-2">
                <button id="cancel-button" type="button" class="h-9 rounded-xl px-3 text-sm font-medium text-zinc-500 transition hover:bg-zinc-200/70 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400">Отменить</button>
                <button type="submit" class="flex h-9 items-center gap-2 rounded-xl bg-zinc-950 px-4 text-sm font-medium text-white transition hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:ring-offset-2 active:scale-[0.98]">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  Добавить
                </button>
              </div>
            </div>
          </form>
        </header>

        <div class="px-6 py-6 sm:px-9 sm:py-8">
          <div class="mb-5 flex items-center justify-between gap-3">
            <div id="filters" class="flex items-center gap-1 rounded-xl bg-zinc-100 p-1" aria-label="Фильтр задач">
              <button data-filter="all" class="filter-button rounded-lg bg-white px-3 py-1.5 text-xs font-medium text-zinc-900 shadow-sm">Все</button>
              <button data-filter="active" class="filter-button rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-500 transition hover:text-zinc-900">В работе</button>
              <button data-filter="done" class="filter-button rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-500 transition hover:text-zinc-900">Готово</button>
            </div>
            <p id="task-count" class="text-xs font-medium text-zinc-400" aria-live="polite"></p>
          </div>

          <ul id="task-list" class="space-y-2" aria-label="Список задач"></ul>

          <div id="empty-state" class="hidden py-14 text-center">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl border border-dashed border-zinc-300 text-zinc-400">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <p id="empty-title" class="text-sm font-semibold text-zinc-700">Задач пока нет</p>
            <p id="empty-copy" class="mt-1 text-sm text-zinc-400">Добавьте первую задачу выше</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "minimal-todo-tasks";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const emptyState = document.querySelector("#empty-state");
      const filters = document.querySelector("#filters");
      let activeFilter = "all";
      let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      document.querySelector("#today").textContent = new Intl.DateTimeFormat("ru-RU", {
        weekday: "long", day: "numeric", month: "long"
      }).format(new Date());

      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));

      function filteredTasks() {
        if (activeFilter === "active") return tasks.filter((task) => !task.done);
        if (activeFilter === "done") return tasks.filter((task) => task.done);
        return tasks;
      }

      function render() {
        const visibleTasks = filteredTasks();
        list.innerHTML = "";

        visibleTasks.forEach((task) => {
          const item = document.createElement("li");
          item.className = "task-row group flex items-center gap-3 rounded-2xl border border-zinc-100 bg-white px-4 py-3 transition hover:border-zinc-200 hover:bg-zinc-50/70";
          item.innerHTML = `
            <label class="flex min-w-0 flex-1 cursor-pointer items-center gap-3">
              <input class="sr-only" type="checkbox" ${task.done ? "checked" : ""} data-action="toggle" data-id="${task.id}" />
              <span class="checkbox-ui flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-zinc-300 bg-white transition">
                <svg class="check-icon text-white" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
              </span>
              <span class="truncate text-sm font-medium transition ${task.done ? "text-zinc-400 line-through" : "text-zinc-800"}"></span>
            </label>
            <button data-action="remove" data-id="${task.id}" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-zinc-300 opacity-60 transition hover:bg-red-50 hover:text-red-500 focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-red-200 sm:opacity-0 sm:group-hover:opacity-100" aria-label="Удалить задачу">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>`;
          item.querySelector("span.truncate").textContent = task.title;
          list.appendChild(item);
        });

        const activeCount = tasks.filter((task) => !task.done).length;
        count.textContent = `${activeCount} ${pluralize(activeCount, ["задача", "задачи", "задач"])} осталось`;
        emptyState.classList.toggle("hidden", visibleTasks.length !== 0);

        const emptyMessages = {
          all: ["Задач пока нет", "Добавьте первую задачу выше"],
          active: ["Всё выполнено", "Можно немного отдохнуть"],
          done: ["Готовых задач нет", "Отмеченные задачи появятся здесь"],
        };
        document.querySelector("#empty-title").textContent = emptyMessages[activeFilter][0];
        document.querySelector("#empty-copy").textContent = emptyMessages[activeFilter][1];
      }

      function pluralize(number, words) {
        const mod10 = number % 10;
        const mod100 = number % 100;
        if (mod10 === 1 && mod100 !== 11) return words[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return words[1];
        return words[2];
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          input.focus();
          return;
        }
        tasks.unshift({ id: crypto.randomUUID(), title, done: false });
        input.value = "";
        activeFilter = "all";
        updateFilterButtons();
        save();
        render();
        input.focus();
      });

      document.querySelector("#cancel-button").addEventListener("click", () => {
        input.value = "";
        input.blur();
      });

      list.addEventListener("click", (event) => {
        const control = event.target.closest("[data-action]");
        if (!control) return;
        const id = control.dataset.id;
        if (control.dataset.action === "remove") tasks = tasks.filter((task) => task.id !== id);
        if (control.dataset.action === "toggle") {
          tasks = tasks.map((task) => task.id === id ? { ...task, done: !task.done } : task);
        }
        save();
        render();
      });

      filters.addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        activeFilter = button.dataset.filter;
        updateFilterButtons();
        render();
      });

      function updateFilterButtons() {
        document.querySelectorAll(".filter-button").forEach((button) => {
          const selected = button.dataset.filter === activeFilter;
          button.classList.toggle("bg-white", selected);
          button.classList.toggle("text-zinc-900", selected);
          button.classList.toggle("shadow-sm", selected);
          button.classList.toggle("text-zinc-500", !selected);
          button.setAttribute("aria-pressed", selected);
        });
      }

      updateFilterButtons();
      render();
    </script>
  </body>
</html>
